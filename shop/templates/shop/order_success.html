{% extends 'base.html' %}
{% block title %}Order confirmed - e_haha{% endblock %}
{% block content %}
<div class="container" style="padding:80px 20px;text-align:center">
  <h1 style="font-size:36px;font-weight:800;margin:16px 0">Thank you for your order!</h1>
  <p style="color:var(--muted);margin-bottom:8px">Order <b>#{{ order.id }}</b> has been placed.</p>
  <p style="color:var(--muted)">Total: <b>RWF{{ order.total_price }}</b></p>
  <div style="margin-top:24px;display:flex;gap:12px;justify-content:center">
    <a href="{% url 'shop:my_orders' %}" class="btn btn-primary">View my orders</a>
    <a href="{% url 'shop:product_list' %}" class="btn btn-outline">Continue shopping</a>
  </div>
</div>
{% endblock %}
